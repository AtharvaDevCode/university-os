name: Test SOGo Login Flow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test login
        env:
          SOGO_USERNAME: ${{ secrets.SOGO_USERNAME }}
          SOGO_PASSWORD: ${{ secrets.SOGO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          python3 <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()

              try:
                  page.goto(
                      "https://sogo.uni-koblenz.de/SOGo/so/",
                      wait_until="domcontentloaded",
                      timeout=45000
                  )

                  print("Login hostname:", page.url.split("/")[2])
                  print("Login page title:", page.title())

                  username = page.locator("#username")
                  password = page.locator("#password")

                  username.fill(os.environ["SOGO_USERNAME"])
                  password.fill(os.environ["SOGO_PASSWORD"])

                  page.locator("button[name='_eventId_proceed']").click()
                  page.wait_for_load_state("domcontentloaded", timeout=30000)
                  page.wait_for_timeout(3000)

                  print("Final hostname:", page.url.split("/")[2])
                  print("Final page title:", page.title())

                  text = (page.locator("body").inner_text() or "").lower()

                  if "outdated request" in text:
                      print("Result: identity-provider request rejected")
                  elif "passkey" in text or "mfa" in text:
                      print("Result: additional authentication or validation may be required")
                  elif "kenn ung" in text or "kennung" in text:
                      print("Result: login form remains visible")
                  elif "sogo" in page.url.lower() and "shibboleth" not in page.url.lower():
                      print("Result: redirected to SOGo; verify session")
                  else:
                      print("Result: login state requires further inspection")

              finally:
                  context.close()
                  browser.close()
          PY
