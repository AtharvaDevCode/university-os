name: Test SOGo Browser Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test university login
        env:
          SOGO_USERNAME: ${{ secrets.SOGO_USERNAME }}
          SOGO_PASSWORD: ${{ secrets.SOGO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          cat > /tmp/test_sogo.py <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()

              try:
                  response = page.goto(
                      "https://sogo.uni-koblenz.de/SOGo/so/",
                      wait_until="domcontentloaded",
                      timeout=45000
                  )

                  print("Initial HTTP status:",
                        response.status if response else "no response")
                  print("Initial hostname:", page.url.split("/")[2])

                  # Wait for the university's actual login form.
                  page.locator("input").first.wait_for(timeout=20000)

                  inputs = page.locator("input")
                  print("Input count:", inputs.count())

                  # Print only field metadata, never values.
                  for i in range(inputs.count()):
                      field = inputs.nth(i)
                      print(
                          "Input", i,
                          "type=", field.get_attribute("type"),
                          "name=", field.get_attribute("name"),
                          "id=", field.get_attribute("id")
                      )

                  # Do not submit credentials to an unknown form.
                  # First establish which authentication page is displayed.
                  print("Page title:", (page.title() or "")[:120])
                  print("Login form detected: yes")

              except Exception as exc:
                  print("Browser test failed:", type(exc).__name__)
                  print("Current hostname:", page.url.split("/")[2])
                  raise
              finally:
                  context.close()
                  browser.close()
          PY

          python /tmp/test_sogo.py
