name: Diagnose University Login

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect login page safely
        run: |
          set -euo pipefail

          cat > /tmp/inspect_login.py <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  response = page.goto(
                      "https://sogo.uni-koblenz.de/SOGo/so/",
                      wait_until="networkidle",
                      timeout=45000
                  )

                  print("HTTP status:", response.status if response else "none")
                  print("Final hostname:", page.url.split("/")[2])
                  print("Page title:", page.title())

                  print("\nVisible form controls:")
                  for item in page.locator(
                      "input:visible, button:visible, select:visible"
                  ).all():
                      print({
                          "tag": item.evaluate("(el) => el.tagName"),
                          "type": item.get_attribute("type"),
                          "name": item.get_attribute("name"),
                          "id": item.get_attribute("id")
                      })

                  print("\nVisible page text:")
                  print((page.locator("body").inner_text() or "")[:1200])

                  print("\nFrames:")
                  for frame in page.frames:
                      print({
                          "url_host": frame.url.split("/")[2]
                              if frame.url.startswith("http") else "local",
                          "name": frame.name
                      })

              except Exception as exc:
                  print("Diagnostic error:", type(exc).__name__)
              finally:
                  browser.close()
          PY

          python /tmp/inspect_login.py
