name: Test SOGo Endpoints

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check SOGo endpoints
        run: |
          for path in \
            "/" \
            "/SOGo/" \
            "/SOGo/so/" \
            "/SOGo/so/atharva20/Mail" \
            "/SOGo/dav/"
          do
            echo "Testing: https://sogo.uni-koblenz.de${path}"

            curl -sS \
              --connect-timeout 10 \
              --max-time 15 \
              -o /dev/null \
              -w "HTTP %{http_code} | Redirect: %{redirect_url}\n" \
              "https://sogo.uni-koblenz.de${path}" || true

            echo
          done
