name: Test SOGo Mail Retrieval

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Authenticate and test mail retrieval
        env:
          SOGO_USERNAME: ${{ secrets.SOGO_USERNAME }}
          SOGO_PASSWORD: ${{ secrets.SOGO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import http.cookiejar

          base = "https://sogo.uni-koblenz.de"
          username = os.environ["SOGO_USERNAME"]
          password = os.environ["SOGO_PASSWORD"]

          cookies = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cookies)
          )

          def request(url, method="GET", payload=None, headers=None):
              data = None
              req_headers = {"Accept": "application/json"}

              if payload is not None:
                  data = json.dumps(payload).encode()
                  req_headers["Content-Type"] = "application/json;charset=UTF-8"

              if headers:
                  req_headers.update(headers)

              req = urllib.request.Request(
                  url, data=data, headers=req_headers, method=method
              )
              return opener.open(req, timeout=20)

          try:
              # Establish the SOGo session.
              request(base + "/SOGo/so/")

              # Authenticate using the JSON payload observed in DevTools.
              response = request(
                  base + "/SOGo/connect",
                  method="POST",
                  payload={
                      "userName": username,
                      "password": password,
                      "domain": None,
                      "rememberLogin": 0
                  }
              )

              body = response.read()
              print("Login HTTP status:", response.status)

              try:
                  result = json.loads(body)
                  print("Login response type:", type(result).__name__)
              except (ValueError, UnicodeDecodeError):
                  print("Login response was not JSON")

              # Probe the inbox endpoint without printing email contents.
              mail_url = (
                  base + "/SOGo/so/atharva/Mail/0/folderINBOX/64/view"
              )
              mail_response = request(mail_url)
              mail_body = mail_response.read()

              print("Mail endpoint HTTP status:", mail_response.status)
              print("Mail content type:",
                    mail_response.headers.get("Content-Type", "unknown"))

              try:
                  mail_data = json.loads(mail_body)
                  print("Mail response JSON type:", type(mail_data).__name__)
                  print("Mail retrieval returned valid JSON: yes")
              except (ValueError, UnicodeDecodeError):
                  print("Mail retrieval returned valid JSON: no")

          except urllib.error.HTTPError as exc:
              print("HTTP request failed with status:", exc.code)
              raise SystemExit(1)
          except Exception as exc:
              print("Request failed with exception type:", type(exc).__name__)
              raise SystemExit(1)
          PY
