name: Test SOGo Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Diagnose SOGo session
        env:
          SOGO_USERNAME: ${{ secrets.SOGO_USERNAME }}
          SOGO_PASSWORD: ${{ secrets.SOGO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          python3 <<'PY'
          import http.cookiejar
          import json
          import os
          import urllib.request
          import urllib.error

          BASE = "https://sogo.uni-koblenz.de"

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar)
          )

          def send(path, method="GET", payload=None):
              headers = {"Accept": "application/json, text/plain, */*"}

              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json;charset=UTF-8"

              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  headers=headers,
                  method=method
              )

              with opener.open(req, timeout=20) as response:
                  body = response.read()
                  print(f"{method} {path}")
                  print("HTTP:", response.status)
                  print("Final URL:", response.url)
                  print("Content-Type:", response.headers.get("Content-Type"))
                  print("Cookies received:", len(list(jar)))
                  print("Body length:", len(body))

                  if path == "/SOGo/connect":
                      print("Login response preview:",
                            body[:120].decode("utf-8", "replace")
                            .replace("\n", " ")[:120])

                  return response.status, body

          try:
              send("/SOGo/so/")

              send(
                  "/SOGo/connect",
                  "POST",
                  {
                      "userName": os.environ["SOGO_USERNAME"],
                      "password": os.environ["SOGO_PASSWORD"],
                      "domain": None,
                      "rememberLogin": 0
                  }
              )

              # Inspect a generic SOGo page, not a private message.
              send("/SOGo/so/atharva/Mail/view")

          except urllib.error.HTTPError as exc:
              print("HTTP error:", exc.code)
              print("Redirect location:",
                    exc.headers.get("Location", "(none)"))
              raise SystemExit(1)
          except Exception as exc:
              print("Request failed:", type(exc).__name__)
              raise SystemExit(1)
          PY
