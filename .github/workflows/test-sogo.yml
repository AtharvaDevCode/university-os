name: Test SOGo Session

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Inspect university login form
        env:
          SOGO_USERNAME: ${{ secrets.SOGO_USERNAME }}
          SOGO_PASSWORD: ${{ secrets.SOGO_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          python3 <<'PY'
          import urllib.request
          import urllib.error
          from html.parser import HTMLParser

          url = "https://sogo.uni-koblenz.de/SOGo/so/"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  html = response.read().decode("utf-8", "replace")
                  print("Final URL:", response.url)
                  print("HTTP status:", response.status)
                  print("Content type:", response.headers.get("Content-Type"))
          except Exception as exc:
              print("Request failed:", type(exc).__name__)
              raise SystemExit(1)

          class FormInspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_form = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag == "form":
                      self.in_form = True
                      print("FORM:", {
                          k: attrs.get(k)
                          for k in ("method", "action", "id", "name")
                      })

                  elif self.in_form and tag == "input":
                      print("INPUT:", {
                          k: attrs.get(k)
                          for k in ("type", "name", "id")
                      })

                  elif self.in_form and tag == "button":
                      print("BUTTON:", {
                          k: attrs.get(k)
                          for k in ("type", "name", "id")
                      })

              def handle_endtag(self, tag):
                  if tag == "form":
                      self.in_form = False

          FormInspector().feed(html)
          PY
