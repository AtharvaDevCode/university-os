name: Test University IMAP Connectivity

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS resolution
        run: |
          getent ahostsv4 imap.uni-koblenz.de

      - name: Test IMAP port 993
        run: |
          timeout 10 bash -c \
            '</dev/tcp/imap.uni-koblenz.de/993' \
            && echo "IMAP_PORT_REACHABLE" \
            || { echo "IMAP_PORT_UNREACHABLE"; exit 1; }
